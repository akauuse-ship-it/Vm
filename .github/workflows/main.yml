name: Moonlight Windows VM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # =============================================
      # 1. Download Tailscale, Sunshine, ViGEmBus
      # =============================================
      - name: Download and install components
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          function Assert-Download($path) {
            $size = (Get-Item $path).Length
            Write-Host "$path size: $size bytes"
            if ($size -lt 100KB) {
              Write-Host "ERROR: $path download failed (file too small). Contents:"
              Get-Content $path
              exit 1
            }
          }

          Write-Host "Downloading Tailscale..."
          curl.exe -L -o tailscale-setup.exe "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Assert-Download "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

          Write-Host "Downloading Sunshine..."
          curl.exe -L -o sunshine.zip "https://github.com/LizardByte/Sunshine/releases/download/v0.23.1/sunshine-windows-portable.zip"
          Assert-Download "sunshine.zip"

          Write-Host "Extracting Sunshine..."
          Expand-Archive sunshine.zip -DestinationPath C:\Sunshine -Force

          Write-Host "Installing ViGEmBus (gamepad support)..."
          curl.exe -L -o vigembus.exe "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          Assert-Download "vigembus.exe"
          Start-Process -FilePath ".\vigembus.exe" -ArgumentList "/qn" -Wait
          $svc = Get-Service ViGEmBus -ErrorAction SilentlyContinue
          Write-Host "ViGEmBus status: $($svc.Status)"

      # =============================================
      # 2. Install Virtual Display (Amyuni usbmmidd)
      # =============================================
      - name: Install Virtual Display
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "Downloading Amyuni usbmmidd virtual display..."
          curl.exe -L -o usbmmidd.zip "https://www.amyuni.com/downloads/usbmmidd_v2.zip"

          $size = (Get-Item usbmmidd.zip).Length
          Write-Host "usbmmidd.zip size: $size bytes"
          if ($size -lt 100KB) {
            Write-Host "WARNING: usbmmidd download failed. Skipping (RDP will still work)."
            exit 0
          }

          Expand-Archive usbmmidd.zip -DestinationPath C:\usbmmidd -Force
          $dir = Get-ChildItem -Path C:\usbmmidd -Recurse -Filter "deviceinstaller64.exe" | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          Write-Host "Installer found at: $dir"
          Set-Location $dir

          Write-Host "Installing virtual display driver..."
          .\deviceinstaller64.exe install usbmmidd.inf usbmmidd
          Start-Sleep -Seconds 5

          Write-Host "Enabling virtual monitor..."
          .\deviceinstaller64.exe enableidd 1
          Start-Sleep -Seconds 8

          Write-Host "Display devices:"
          Get-PnpDevice -Class Display | Format-Table Name, Status -AutoSize

      # =============================================
      # 3. Enable RDP (PRIMARY access method)
      # =============================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "Setting password for runneradmin..."
          net user runneradmin "RdpPass123!"

          Write-Host "Enabling RDP..."
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Relaxing NLA requirement (needed for some mobile RDP apps)..."
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          Write-Host "RDP enabled. User: runneradmin"

      # =============================================
      # 4. Configure Sunshine (secondary access)
      # =============================================
      - name: Configure Sunshine
        shell: powershell
        run: |
          $sunshineDir = Get-ChildItem -Path C:\Sunshine -Recurse -Filter "sunshine.exe" | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          Write-Host "Sunshine found at: $sunshineDir"
          echo "SUNSHINE_DIR=$sunshineDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $confDir = Join-Path $sunshineDir "config
