name: Moonlight Windows VM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ─────────────────────────────────────────────
      # 1. Download Tailscale, Sunshine, ViGEmBus
      # ─────────────────────────────────────────────
      - name: Download and install components
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "Downloading Tailscale..."
          curl.exe -L -o tailscale-setup.exe "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

          Write-Host "Downloading Sunshine..."
          curl.exe -L -o sunshine.zip "https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-portable.zip"

          Write-Host "Extracting Sunshine..."
          Expand-Archive sunshine.zip -DestinationPath C:\Sunshine -Force

          Write-Host "Installing ViGEmBus (gamepad support)..."
          curl.exe -L -o vigembus.exe "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          Start-Process -FilePath ".\vigembus.exe" -ArgumentList "/qn" -Wait
          $svc = Get-Service ViGEmBus -ErrorAction SilentlyContinue
          Write-Host "ViGEmBus status: $($svc.Status)"

      # ─────────────────────────────────────────────
      # 2. Install Virtual Display Driver (headless fix)
      # ─────────────────────────────────────────────
      - name: Install Virtual Display Driver
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "Downloading Virtual Display Driver..."
          curl.exe -L -o vdd.zip "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/24.12.24/Signed-Driver-v24.12.24.zip"
          Expand-Archive vdd.zip -DestinationPath C:\VDD -Force

          Write-Host "Trusting driver certificate..."
          $cert = Get-ChildItem -Path C:\VDD -Recurse -Filter "*.cer" | Select-Object -First 1
          if ($cert) {
            Import-Certificate -FilePath $cert.FullName -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            Import-Certificate -FilePath $cert.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
            Write-Host "Certificate imported."
          } else {
            Write-Host "WARNING: No certificate found in package."
          }

          Write-Host "Installing driver..."
          $inf = Get-ChildItem -Path C:\VDD -Recurse -Filter "*.inf" | Select-Object -First 1
          pnputil /add-driver $inf.FullName /install

          Write-Host "Downloading nefcon (device creator)..."
          curl.exe -L -o nefcon.zip "https://github.com/nefarius/nefcon/releases/download/v1.11.0/nefcon_v1.11.0.zip"
          Expand-Archive nefcon.zip -DestinationPath C:\nefcon -Force
          $nefcon = Get-ChildItem -Path C:\nefcon -Recurse -Filter "nefconw.exe" | Select-Object -First 1

          Write-Host "Creating virtual display device..."
          & $nefcon.FullName --create-device-node --hardware-id "Root\MttVDD" --class-name "Display" --class-guid "4d36e968-e325-11ce-bfc1-08002be10318"
          Start-Sleep -Seconds 8

          Write-Host "Display devices:"
          Get-PnpDevice -Class Display | Format-Table Name, Status -AutoSize

      # ─────────────────────────────────────────────
      # 3. Configure Sunshine (software encoding + creds)
      # ─────────────────────────────────────────────
      - name: Configure Sunshine
        shell: powershell
        run: |
          $sunshineDir = Get-ChildItem -Path C:\Sunshine -Recurse -Filter "sunshine.exe" | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          Write-Host "Sunshine found at: $sunshineDir"
          echo "SUNSHINE_DIR=$sunshineDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $confDir = Join-Path $sunshineDir "config"
          New-Item -ItemType Directory -Path $confDir -Force | Out-Null

          @"
          encoder = software
          sw_preset = ultrafast
          min_log_level = info
          "@ | Out-File (Join-Path $confDir "sunshine.conf") -Encoding ascii

          Write-Host "Setting Web UI credentials..."
          & (Join-Path $sunshineDir "sunshine.exe") --creds admin "ChangeMe123!"
          Write-Host "Config done."

      # ─────────────────────────────────────────────
      # 4. Connect Tailscale + start Sunshine + expose Web UI
      # ─────────────────────────────────────────────
      - name: Start Tailscale and Sunshine
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Connecting to tailnet..."
          & $ts up --authkey=$env:TS_AUTHKEY --hostname=moonlight-vm --accept-routes --unattended
          Start-Sleep -Seconds 5
          $tsIP = (& $ts ip -4).Trim()
          Write-Host "Tailscale IP: $tsIP"

          Write-Host "Starting Sunshine from: $env:SUNSHINE_DIR"
          Start-Process -FilePath (Join-Path $env:SUNSHINE_DIR "sunshine.exe") -WorkingDirectory $env:SUNSHINE_DIR

          Write-Host "Waiting 30 seconds for Sunshine to initialize..."
          Start-Sleep -Seconds 30

          $proc = Get-Process sunshine -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "ERROR: Sunshine crashed. Log output:"
            Get-Content (Join-Path $env:SUNSHINE_DIR "config\sunshine.log") -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "SUCCESS: Sunshine is running (PID $($proc.Id))."

          Write-Host "Exposing Sunshine Web UI over the tailnet..."
          & $ts serve --bg --https=47990 https+insecure://localhost:47990

          Write-Host "--- TAILSCALE SERVE STATUS ---"
          & $ts serve status

          Write-Host "=========================================="
          Write-Host "  RUN NUMBER       : ${{ github.run_number }}"
          Write-Host "  TAILSCALE IP     : $tsIP"
          Write-Host "  WEB UI (phone)   : https://moonlight-vm.tailbf19d8.ts.net:47990"
          Write-Host "  WEB UI LOGIN     : admin / ChangeMe123!"
          Write-Host "  MOONLIGHT HOST   : $tsIP   (add this IP in Moonlight)"
          Write-Host "=========================================="

          Write-Host "--- SUNSHINE.LOG (startup) ---"
          Get-Content (Join-Path $env:SUNSHINE_DIR "config\sunshine.log") -Tail 40 -ErrorAction SilentlyContinue

      # ─────────────────────────────────────────────
      # 5. Keep-alive watchdog (~5h55m)
      # ─────────────────────────────────────────────
      - name: Keep alive
        shell: powershell
        run: |
          $cutoff = [DateTime]::Now.AddHours(5).AddMinutes(55)
          $crashCount = 0

          while ([DateTime]::Now -lt $cutoff) {
            $proc = Get-Process sunshine -ErrorAction SilentlyContinue

            if (-not $proc) {
              $crashCount++
              Write-Host "$(Get-Date -Format 'MM/dd/yyyy HH:mm:ss'): Sunshine down — restarting... (crash #$crashCount)"
              Write-Host "--- LAST 40 LOG LINES ---"
              Get-Content (Join-Path $env:SUNSHINE_DIR "config\sunshine.log") -Tail 40 -ErrorAction SilentlyContinue

              if ($crashCount -ge 5) {
                Write-Host "FATAL: Sunshine crashed 5 times. Stopping. Check the log output above."
                exit 1
              }

              Start-Process -FilePath (Join-Path $env:SUNSHINE_DIR "sunshine.exe") -WorkingDirectory $env:SUNSHINE_DIR
              Start-Sleep -Seconds 20
            }

            Start-Sleep -Seconds 30
          }

          Write-Host "Time limit reached. Shutting down."
